name: Auto News Publisher Bot

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর চলবে
    - cron: '*/10 * * * *'
  workflow_dispatch: # GitHub থেকে ম্যানুয়ালি রান করার অপশন

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser newspaper4k google-genai google-api-python-client google-auth-oauthlib lxml_html_clean

    - name: Run News Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
      run: python Main.py

    - name: Commit and Push Visited Log
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add visited_urls.json
        git diff-index --quiet HEAD || git commit -m "Update visited URLs log [skip ci]"
        git push

        